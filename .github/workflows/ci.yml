name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pandas duckdb boto3 moto pytest pytest-mock \
            loguru python-dotenv python-dateutil requests \
            great_expectations==1.19.0

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          WATERMARK_FILE: /tmp/watermark.json
          DUCKDB_PATH: /tmp/crime_test.duckdb
          RAW_DATA_DIR: /tmp/raw

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests/ -v --tb=short

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb==1.7.0

      - name: dbt compile (syntax check)
        working-directory: dbt_crime
        run: dbt compile --profiles-dir . --target dev
        env:
          DUCKDB_PATH: /tmp/crime_ci.duckdb

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt (syntax/style check)
        run: terraform fmt -check -diff

      # No AWS credentials here on purpose — this is syntax/schema validation
      # only. It never plans or applies, so it can't create real AWS resources.
      - name: terraform init (no backend, no state)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate
