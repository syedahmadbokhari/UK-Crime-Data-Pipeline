version: '3.8'

# Streaming services (kafka, streaming-producer, streaming-consumer) all carry
# `profiles: ["streaming"]` below, so `docker-compose up` (no profile) starts
# exactly what it always has — the batch/Airflow stack — unchanged. The
# streaming path is opt-in via `docker-compose --profile streaming up`; see
# the "Real-Time Streaming (Kafka)" section in README.md.
x-streaming-common: &streaming-common
  build:
    context: .
    dockerfile: Dockerfile.streaming
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: crime-reports
    DUCKDB_PATH: /app/warehouse/crime.duckdb
    RAW_DATA_DIR: /app/data/raw
    REJECTED_DATA_DIR: /app/data/rejected
    # S3 upload is best-effort here, same "no AWS needed to start" philosophy
    # as Quick Start step 3 — leave S3_BUCKET_NAME unset to run Kafka +
    # DuckDB only. See streaming/consumer.py.
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-2}
  volumes:
    - ./data:/app/data
    - ./warehouse:/app/warehouse
  depends_on:
    kafka:
      condition: service_healthy
  profiles: ["streaming"]

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0-python3.11
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Pipeline env vars — override with your real values in .env
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-2}
    DUCKDB_PATH: /opt/airflow/warehouse/crime.duckdb
    RAW_DATA_DIR: /opt/airflow/data/raw
    WATERMARK_FILE: /opt/airflow/warehouse/watermark.json
    PIPELINE_FORCES: west-yorkshire
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./warehouse:/opt/airflow/warehouse
    - ./dbt_crime:/opt/airflow/dbt_crime
    - ./data:/opt/airflow/data
    - ./data_quality:/opt/airflow/data_quality
    - ./great_expectations:/opt/airflow/great_expectations
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install dbt-duckdb boto3 loguru python-dateutil great_expectations==1.19.0 &&
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname Ahmad \
          --lastname Bokhari \
          --role Admin \
          --email admin@example.com \
          --password admin
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      DUCKDB_PATH: /app/warehouse/crime.duckdb
    volumes:
      - ./warehouse:/app/warehouse
    depends_on:
      - airflow-scheduler

  crimes-api-db:
    image: postgres:15
    environment:
      POSTGRES_DB: crimes_api
      POSTGRES_USER: crimes
      POSTGRES_PASSWORD: crimes
    ports:
      - "5433:5432"
    volumes:
      - crimes-api-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crimes"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Streaming (opt-in: docker-compose --profile streaming up) ----------
  # Single-node Kafka in KRaft mode (no Zookeeper) — the modern, officially
  # supported setup since Kafka 3.7's apache/kafka image, and one fewer
  # container than a Zookeeper-based setup for a single-broker demo.
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"   # host access, e.g. running producer.py/consumer.py outside Docker
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    profiles: ["streaming"]

  # One-shot: publishes a CSV's rows to Kafka one message at a time, then
  # exits (see streaming/producer.py). Re-run with `docker-compose --profile
  # streaming run streaming-producer` to stream another force/month.
  streaming-producer:
    <<: *streaming-common
    command: ["python", "-m", "streaming.producer", "--force", "west-yorkshire", "--month", "2026-02"]

  # Long-running: consumes crime-reports, validates each micro-batch with the
  # same Great Expectations suite the batch pipeline uses, and writes to
  # DuckDB (+ S3 if configured). See streaming/consumer.py.
  streaming-consumer:
    <<: *streaming-common
    command: ["python", "-m", "streaming.consumer"]

  crime-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://crimes:crimes@crimes-api-db:5432/crimes_api
      SECRET_KEY: ${API_SECRET_KEY:-dev-secret-key-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300
      RATE_LIMIT_DEFAULT: 100/minute
      RATE_LIMIT_EXPENSIVE: 20/minute
    volumes:
      - ./data:/app/data
    depends_on:
      crimes-api-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-db:
  airflow-logs:
  crimes-api-db:
  kafka-data:
